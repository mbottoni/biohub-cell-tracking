[project]
name = "ctrack"
version = "0.1.0"
description = "Biohub Cell Tracking During Development — Kaggle solution"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-image",
    "tifffile",
    "zarr",
    "networkx",
    "tqdm",
    "matplotlib",
]

[project.optional-dependencies]
# heavier / platform-specific; install once Phase 0 confirms the compute target
train = ["torch", "monai"]
dev = ["pytest", "ruff", "ipykernel", "jupyter"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ctrack"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
